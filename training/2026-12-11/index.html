<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>경남형 AI·디지털 기반 정보교육 수업모형 개발 연수</title>
  <link rel="stylesheet" href="./home.css">
<link rel="stylesheet" href="./training-cards.css">
</head>
<body>
  <!-- Reuse the reference artwork at its original proportions through cropped views. -->
  <svg class="art-source" aria-hidden="true" width="0" height="0">
    <defs>
      <image id="reference" href="../../assets/images/training-home-v1.png" width="950" height="534.66"/>
    </defs>
  </svg>
  <main class="stage">
    <div class="home">
      <header class="hero">
        <p class="tagline">경남형 AI·디지털 기반 <span>정보교육 수업모형</span> 개발 연수</p>
        <img class="hero-teacher" src="../../assets/images/teacher-character-left.png" alt="연수 교사 캐릭터">
        <h1>피지컬 컴퓨팅 기반의<br><span>확장적 문제 해결 수업</span></h1>
        <img class="hero-project" src="../../assets/images/scarecrow-project.png" alt="빙글빙글 허수아비 프로젝트">
      </header>

      <nav class="cards" aria-label="연수 메뉴">
        <button class="card icebreaker" type="button" data-pending aria-labelledby="icebreaker-title">
          <span class="card-heading"><span class="number" aria-hidden="true">01</span><span id="icebreaker-title">아이스브레이킹</span></span>
          <span class="description">연수의 시작,<br>함께 가볍게 열어봐요!</span>
          <svg class="card-art" aria-hidden="true" viewBox="265 211 152 121">
            <use href="#reference" clip-path="polygon(267px 244px, 287px 242px, 293px 214px, 406px 212px, 402px 246px, 417px 254px, 417px 281px, 394px 285px, 387px 328px, 350px 332px, 287px 327px, 290px 287px, 267px 276px)"/>
          </svg>
          <span class="arrow" aria-hidden="true"></span>
        </button>

        <a class="card slides" href="./slides.html" data-open-training="slides" aria-labelledby="slides-title">
          <span class="card-heading"><span class="number" aria-hidden="true">02</span><span id="slides-title">연수 슬라이드</span></span>
          <span class="description">수업모형의 이해와<br>적용 사례를 살펴봐요!</span>
          <svg class="card-art" aria-hidden="true" viewBox="707 212 181 110">
            <use href="#reference" clip-path="polygon(710px 312px, 717px 238px, 737px 236px, 745px 226px, 847px 215px, 883px 211px, 888px 250px, 863px 253px, 856px 309px, 847px 312px, 847px 321px, 821px 321px, 815px 318px, 712px 319px)"/>
          </svg>
          <span class="arrow" aria-hidden="true"></span>
        </a>

        <a class="card lessons" href="./lessons.html" data-open-training="lessons" aria-labelledby="lessons-title">
          <span class="card-heading"><span class="number" aria-hidden="true">03</span><span id="lessons-title">11차시 수업자료</span></span>
          <span class="description">수업모형을 적용한<br>피지컬 컴퓨팅 수업(총 11차시)을<br>바로 활용해요!</span>
          <svg class="card-art" aria-hidden="true" viewBox="280 355 165 116">
            <use href="#reference" clip-path="polygon(282px 453px, 293px 441px, 293px 370px, 402px 359px, 407px 355px, 444px 355px, 439px 393px, 444px 408px, 442px 435px, 432px 435px, 423px 456px, 402px 462px, 390px 470px, 282px 469px)"/>
          </svg>
          <span class="arrow" aria-hidden="true"></span>
        </a>

        <button class="card practice" type="button" data-pending aria-labelledby="practice-title">
          <span class="card-heading"><span class="number" aria-hidden="true">04</span><span id="practice-title">2부 실습자료 공유</span></span>
          <span class="description">연수 중 실습 활동 자료와<br>결과물을 함께 공유해요!</span>
          <svg class="card-art" aria-hidden="true" viewBox="742 357 160 117">
            <use href="#reference" clip-path="polygon(743px 455px, 748px 399px, 758px 396px, 765px 378px, 801px 379px, 805px 360px, 865px 370px, 872px 357px, 901px 360px, 901px 396px, 884px 397px, 882px 432px, 869px 435px, 851px 432px, 845px 469px, 830px 474px, 747px 465px)"/>
          </svg>
          <span class="arrow" aria-hidden="true"></span>
        </button>
      </nav>

      <footer class="training-details">
        <p class="schedule">
          <time datetime="2026-12-11">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h2m4 0h2m-8 3h2"/></svg>
            2026. 12. 11. (금)
          </time>
          <span class="hours">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5h5"/></svg>
            18:30 ~ 20:30
          </span>
        </p>
        <dl class="speaker">
          <div><dt>소속</dt><dd>○○중학교</dd></div>
          <div><dt>성명</dt><dd>○○○</dd></div>
        </dl>
      </footer>
      <svg class="waves" aria-hidden="true" viewBox="0 0 950 72" preserveAspectRatio="none">
        <path fill="#9ec8fd" d="M0 1C68 16 38 63 146 72H0ZM950 15C871 41 841 69 720 72H950Z"/>
        <path fill="#75aaf4" d="M0 46C168 2 206 60 424 67S681 10 771 27S894 61 950 44V72H0Z"/>
      </svg>
    </div>
  </main>

  <dialog aria-labelledby="pending-title" aria-describedby="pending-message">
    <h2 id="pending-title"></h2>
    <p id="pending-message">준비 중인 메뉴입니다.</p>
    <form method="dialog"><button autofocus>확인</button></form>
  </dialog>
  <script>
    const home = document.querySelector('.stage');
    let frame;
    let activeCard;

    function showTraining(card) {
      if (card === activeCard) return;
      frame?.remove();
      const previousCard = activeCard;
      activeCard = card;
      home.hidden = Boolean(card);
      if (!card) {
        frame = undefined;
        previousCard?.focus();
        return;
      }

      frame = document.createElement('iframe');
      frame.className = 'training-screen';
      frame.title = document.getElementById(card.getAttribute('aria-labelledby')).textContent;
      frame.src = card.href;
      frame.allowFullscreen = true;
      frame.addEventListener('load', () => frame?.contentWindow.focus(), { once: true });
      document.body.append(frame);
    }

    function restoreTraining() {
      const cards = [...document.querySelectorAll('a[data-open-training]')];
      showTraining(cards.find(card => card.href === history.state?.trainingScreen));
    }

    function openTraining(card) {
      if (!card || card === activeCard) return;
      const trainingDepth = (history.state?.trainingDepth ?? 0) + 1;
      history.pushState({ trainingScreen: card.href, trainingDepth }, '');
      showTraining(card);
    }

    document.addEventListener('click', event => {
      const card = event.target.closest('a[data-open-training]');
      if (!card || event.defaultPrevented || event.button !== 0 ||
          event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      openTraining(card);
    });

    window.addEventListener('popstate', restoreTraining);
    window.addEventListener('message', event => {
      if (!frame || event.source !== frame.contentWindow || event.origin !== location.origin) return;
      if (event.data === 'phycom-home') history.go(-(history.state?.trainingDepth || 1));
      if (event.data?.type === 'training-open') {
        const card = [...document.querySelectorAll('a[data-open-training]')]
          .find(item => item.dataset.openTraining === event.data.id);
        openTraining(card);
      }
    });

    history.replaceState({ ...history.state, trainingScreen: null, trainingDepth: 0 }, '');

    const pendingDialog = document.querySelector('dialog');
    const pendingTitle = document.querySelector('#pending-title');

    document.querySelectorAll('[data-pending]').forEach(card => {
      card.addEventListener('click', () => {
        pendingTitle.textContent = document.getElementById(card.getAttribute('aria-labelledby')).textContent;
        pendingDialog.showModal();
      });
    });
  </script>
</body>
</html>
